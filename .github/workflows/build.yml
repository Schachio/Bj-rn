name: Build Hunger Pangs Plus

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build HungerPangsPlus.csproj -c Release
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: HungerPangsPlus
          path: bin/Release/net48/HungerPangsPlus.dll
