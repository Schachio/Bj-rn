name: Build AutoSort Production

on:
  push:
    branches: [ autosort-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build AutoSortProduction.csproj -c Release
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: AutoSortProduction
          path: bin/Release/net48/AutoSortProduction.dll
